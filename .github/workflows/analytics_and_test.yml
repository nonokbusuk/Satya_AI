name: Analytics and Test Harness

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  root-tests:
    name: Root SDK and dashboard tests
    runs-on: ubuntu-latest
    env:
      SATYA_AGENT_KEYS: root-ci-agent-key-not-for-production
      HUMAN_VIEW_TOKEN: root-ci-human-token-not-for-production
      AUDIT_SECRET: root-ci-audit-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install root package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run root suite
        run: PYTHONPATH=. pytest -q tests/

  nested-api-tests:
    name: Nested FastAPI governance API tests
    runs-on: ubuntu-latest
    env:
      SATYA_AGENT_KEYS: nested-ci-agent-key-not-for-production
      AUDIT_SECRET: nested-ci-audit-secret-at-least-32-characters-long
      DATABASE_URL: sqlite+aiosqlite:///:memory:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install nested API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "satya-ai[test]"
      - name: Run nested API suite
        working-directory: satya-ai
        run: pytest -q tests/

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    env:
      SATYA_AGENT_KEYS: compose-ci-agent-key-not-for-production
      AUDIT_SECRET: compose-ci-audit-secret-at-least-32-characters-long
      POSTGRES_USER: satya
      POSTGRES_PASSWORD: compose-ci-database-password-not-for-production
      POSTGRES_DB: satya
      DATABASE_URL: postgresql+asyncpg://satya:compose-ci-database-password-not-for-production@postgres:5432/satya
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f satya-ai/docker-compose.yml config --quiet

  analytics:
    name: Repository analytics
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      SATYA_AGENT_KEYS: root-ci-agent-key-not-for-production
      HUMAN_VIEW_TOKEN: root-ci-human-token-not-for-production
      AUDIT_SECRET: root-ci-audit-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 gitpython markdownify pandas requests streamlit
      - name: Generate analytics
        run: python generate_analytics.py
      - name: Commit updated analytics
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md REPO_ANALYTICS.md repo_analytics.json
          git commit -m "chore: auto-update repository analytics" || echo "No analytics changes to commit"
          git push origin main || echo "Analytics push skipped; check branch permissions"
